# ============================================================
#  Clip pipeline settings — edit the values on the right.
# ============================================================

# --- Where files go ---
work_folder: work          # downloads, transcripts, chat (one subfolder per VOD)
output_folder: output      # finished clips for you to review

# --- Stage 1: download ---
video_quality: 720         # max video height to download (Kick VODs top out at 720)

# --- Stage 2: transcription ---
whisper_model: small       # tiny / base / small / medium  (bigger = more accurate, slower)
whisper_language: en       # set to null to auto-detect

# --- Stage 3: finding chat spikes ---
window_seconds: 10         # chat is counted in chunks of this many seconds
top_spikes: 15             # how many of the busiest moments to send to Claude
min_gap_seconds: 90        # spikes closer together than this count as one moment
emote_weight: 2.0          # an emote-spam message counts this many times a normal one
emotes:                    # words/emotes that count as hype (not case-sensitive).
                           # Kick emotes match if their name ENDS with one of these,
                           # e.g. "collectiblesW" counts as W, "emojiDead" counts as Dead.
  - W
  - DEAD
  - CRYING
  - ICANT
  - LMFAO
  - KEKW
  - LUL
  - LMAO
  - LOL
  - OMEGALUL
  - POG
  - POGGERS
  - PogChamp
  - EZ
  - L
  - "?"
  - "😂"
  - "💀"

# --- Stage 4: asking Claude ---
model: claude-sonnet-5-5
prompt_file: prompt.txt
seconds_before_spike: 60
seconds_after_spike: 30

# --- Stage 5: making clips ---
min_score: 7               # only clips scoring this or higher get made
clip_width: 1080
clip_height: 1920
crop_mode: center          # center = zoom into the middle of the screen
                           # blur   = whole stream in the middle, blurred copy behind it
caption_font: Inter Display Black   # any installed font; falls back to a default if missing
words_per_caption: 3       # how many words show on screen at once
hook_seconds: 4            # how long the hook text stays at the top (0 = whole clip)


# ============================================================
#  YouTube training-clip pipeline (yt_clips.py) — separate from
#  the Kick/Twitch settings above; nothing up there is used by it.
# ============================================================
youtube:
  max_height: 1080         # best quality up to this height is downloaded
  clip_count: 5            # how many clips to make (--count overrides)
  clip_length: 60          # target clip length in seconds (--length overrides)
  min_length: 40           # clips are never shorter than this...
  max_length: 75           # ...or longer than this (unless you use --manual)
  crop: smart              # smart  = follow the players (YOLO person detection)
                           # center = plain centre crop
  # --- picking the moments ---
  yolo_model: yolo11n.pt   # yolo11s.pt is more accurate on far-away players but ~2.5x slower
  analysis_yolo_every: 2   # seconds between person-detection samples when scanning the whole video
  min_people: 2            # a drill needs at least this many players on screen
  # --- following the action ---
  track_fps: 5             # person-detection samples per second inside each clip
  track_imgsz: 960         # detection resolution (bigger finds smaller players, slower)
  max_pan_speed: 0.12      # fastest the crop may pan, in screen-widths per second
  dead_zone: 0.05          # ignore action shifts smaller than this (screen widths): stops jitter
  # --- output quality ---
  width: 1080
  height: 1920
  crf: 18                  # lower = sharper and bigger files (17-20 is sensible)
  preset: slow             # x264 speed/efficiency: medium is ~2x faster, slightly bigger files
  max_fps: 60
  loudness: -14            # target loudness in LUFS (TikTok/Reels/Shorts level)
