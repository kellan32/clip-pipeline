# ============================================================
#  Clip pipeline settings — edit the values on the right.
# ============================================================

# --- Where files go ---
work_folder: work          # downloads, transcripts, chat (one subfolder per VOD)
output_folder: output      # finished clips for you to review

# --- Stage 1: download ---
video_quality: 720         # max video height to download (Kick VODs top out at 720)

# --- Stage 2: transcription ---
whisper_model: small       # tiny / base / small / medium  (bigger = more accurate, slower)
whisper_language: en       # set to null to auto-detect

# --- Stage 3: finding chat spikes ---
window_seconds: 10         # chat is counted in chunks of this many seconds
top_spikes: 15             # how many of the busiest moments to send to Claude
min_gap_seconds: 90        # spikes closer together than this count as one moment
emote_weight: 2.0          # an emote-spam message counts this many times a normal one
emotes:                    # words/emotes that count as hype (not case-sensitive).
                           # Kick emotes match if their name ENDS with one of these,
                           # e.g. "collectiblesW" counts as W, "emojiDead" counts as Dead.
  - W
  - DEAD
  - CRYING
  - ICANT
  - LMFAO
  - KEKW
  - LUL
  - LMAO
  - LOL
  - OMEGALUL
  - POG
  - POGGERS
  - PogChamp
  - EZ
  - L
  - "?"
  - "😂"
  - "💀"
clip_call_weight: 5.0      # a message telling someone to clip it counts this many times a normal one
clip_phrases:              # messages containing any of these (whole words, not case-sensitive)
  - clip                   # "clip", "clip it", "clip that", "W clip", "bad clip"...
  - clips
  - clipped
  - clipping
  - clip it
  - clip that
  - clip this
  - viral
  - going viral
  - tiktok
viewer_clip_weight: 20     # Twitch: bonus for each clip a viewer made of a moment (grows with its views)

# --- Stage 4: asking Claude ---
model: claude-sonnet-5-5
prompt_file: prompt.txt
seconds_before_spike: 60
seconds_after_spike: 30

# --- Stage 5: making clips ---
min_score: 7               # only clips scoring this or higher get made
clip_width: 1080
clip_height: 1920
crop_mode: center          # center = zoom into the middle of the screen
                           # blur   = whole stream in the middle, blurred copy behind it
caption_font: Inter Display Black   # any installed font; falls back to a default if missing
words_per_caption: 3       # how many words show on screen at once
hook_seconds: 4            # how long the hook text stays at the top (0 = whole clip)
censor_curses: true       # stage 6: star one vowel in curse words in captions/titles (F*CK, SH*T)

# --- Stage 6: voice colours in captions ---
speaker_colors: true       # main voice white, anyone else green, ONLY when it's easy to tell them apart
speaker_color_list: [00FF00]   # colour for the other voice (RGB hex)
speaker_main_threshold: 0.45   # a line must match the main voice at least this well to stay white
speaker_other_threshold: 0.20  # ...or match it at most this well to turn green
speaker_max_unsure: 0.05   # if more than 5% of the talking is in between, no colours for that clip
